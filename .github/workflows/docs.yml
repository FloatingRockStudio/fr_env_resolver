name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs tooling
        run: python -m pip install --upgrade pip pdoc

      - name: Install package
        run: python -m pip install -e .

      - name: Build API documentation
        run: python -m pdoc --output-dir site src/fr_env_resolver

      - name: Add docs landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path("site/index.html")
          index.write_text(
              """
              <!doctype html>
              <html>
              <head><meta charset='utf-8'><title>fr_env_resolver docs</title></head>
              <body>
                <h1>fr_env_resolver documentation</h1>
                <p><a href='./fr_env_resolver.html'>API reference</a></p>
              </body>
              </html>
              """.strip(),
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
